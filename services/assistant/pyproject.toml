[project]
name = "dealflow-assistant"
version = "0.1.0"
description = "Read-only text assistant over the DealFlow360 database"
requires-python = ">=3.12,<3.13"
dependencies = [
    "langgraph>=1.0",
    "langchain-openai>=1.0",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.5",
    "httpx>=0.27",
]

[tool.uv]
package = false

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
