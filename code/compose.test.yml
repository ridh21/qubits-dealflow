services:
  test-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: dealflow
      POSTGRES_PASSWORD: dealflow_test
      POSTGRES_DB: dealflow_test
    ports:
      - "127.0.0.1:55436:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dealflow -d dealflow_test"]
      interval: 2s
      timeout: 3s
      retries: 15
    tmpfs:
      - /var/lib/postgresql/data
